services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperplane
      POSTGRES_USER: paperplane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paperplane-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperplane"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
