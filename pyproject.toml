[project]
name = "agentic-document-extraction"
version = "4.2.1"
description = "A local Streamlit app for layout-aware Markdown from PDFs, images, and Office files."
authors = [
  { name = "Ahmad" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
keywords = [
  "document-extraction",
  "ocr",
  "markdown",
  "streamlit",
  "visual-grounding",
  "openai",
  "pymupdf",
  "docling",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "streamlit[pdf]>=1.61.1,<2",
  "pydantic>=2.0,<3.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.1,<2",
  "pymupdf>=1.28,<2",
  "Pillow>=12.3.0,<13",
  "docling>=2.66,<3",
  "bleach>=6,<7",
]

[project.optional-dependencies]
# Everything needed to run the test suite.
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0",
]
# Linting + formatting.
lint = [
  "ruff>=0.6.0",
  "pyright>=1.1.400",
]
docs = [
  "Markdown>=3.7,<4",
  "reportlab>=4.4,<5",
]

[project.urls]
Homepage = "https://github.com/pypi-ahmad/Agentic-Document-Extraction"
Repository = "https://github.com/pypi-ahmad/Agentic-Document-Extraction"
Issues = "https://github.com/pypi-ahmad/Agentic-Document-Extraction/issues"
Changelog = "https://github.com/pypi-ahmad/Agentic-Document-Extraction/blob/main/CHANGELOG.md"

[tool.uv]
required-version = ">=0.5.0"
package = false

# ── Pytest ───────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--tb=short",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:websockets.*",
  "ignore::DeprecationWarning:pydantic.*",
]

# ── Ruff (lint + format) ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".venv",
  "dist",
  "build",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter
  "B904",   # raise from inside except is noisy in pipeline code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]  # tests are allowed to be slightly looser

[tool.ruff.lint.isort]
known-first-party = ["paperplane"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Pyright (strict type-checker) ────────────────────────────────────
[tool.pyright]
include = ["paperplane", "streamlit_app.py", "scripts"]
exclude = [
  ".venv",
]
pythonVersion = "3.12"
pythonPlatform = "Linux"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"
reportMissingTypeArgument = "warning"
reportInvalidTypeVarUse = "warning"
reportPrivateImportUsage = "warning"
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportOptionalMemberAccess = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportReturnType = "warning"
