[server]
address = "127.0.0.1"
port = 8551
maxUploadSize = 200
enableXsrfProtection = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#D32F2F"
backgroundColor = "#0B0B0D"
secondaryBackgroundColor = "#17171A"
textColor = "#F2F2F2"
borderColor = "#3D2023"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"

[theme.sidebar]
backgroundColor = "#111113"
secondaryBackgroundColor = "#211517"
textColor = "#F2F2F2"
borderColor = "#462327"
