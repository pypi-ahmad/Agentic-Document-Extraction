name: Bug report
description: Report a bug or unexpected behaviour.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Use synthetic or redacted
        examples only. Never attach private documents, provider responses, or keys.

  - type: input
    id: version
    attributes:
      label: Affected version
      description: "Copy the Paperplane version shown in the Streamlit footer."
      placeholder: "5.2.0"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps that trigger the bug. Include the document type,
        processing engine, selected model, page range, and whether affected
        PDF pages are native, scanned, or mixed.
      placeholder: |
        1. Select Ollama ADE and glm-ocr:latest.
        2. Upload a synthetic one-page invoice image.
        3. Select page 1 and choose Parse files.
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Copy the safe UI error and relevant launcher or terminal output.
        Remove document content, provider responses, and API keys.

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        OS, CPU/GPU, Python version, uv version, processing engine, selected
        model, input type, and configured environment-variable names. Never
        include their values.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce the bug on `main` at the version above.
          required: true
        - label: I removed credentials, private data, and non-redistributable documents.
          required: true
