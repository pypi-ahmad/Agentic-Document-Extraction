name: Benchmark transparency report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"
      - "scripts/benchmark_report.py"
      - "paperplane/benchmark.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --with "pydantic>=2,<3" python scripts/benchmark_report.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark-site
      - id: deployment
        uses: actions/deploy-pages@v4
