name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Streamlit app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12.10"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra lint --extra docs

      - name: Ruff lint
        run: uv run --no-sync ruff check paperplane tests streamlit_app.py scripts

      - name: Ruff format check
        run: uv run --no-sync ruff format --check paperplane tests streamlit_app.py scripts

      - name: Pyright
        run: uv run --no-sync pyright

      - name: Pytest with coverage
        run: >-
          uv run --no-sync pytest tests
          --cov=paperplane
          --cov-report=xml
          --cov-report=term-missing
          -q
          -p no:cacheprovider

      - name: Rebuild generated documentation
        run: |
          uv run --no-sync python scripts/build_handbook.py
          uv run --no-sync python scripts/build_app_guide.py
          git diff --exit-code -- docs/APP_CAPABILITIES.html

      - name: Smoke-test Streamlit startup
        run: |
          uv run --no-sync streamlit run streamlit_app.py \
            --server.headless=true \
            --server.address=127.0.0.1 \
            --server.port=8501 &
          streamlit_pid=$!
          trap 'kill "$streamlit_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
