name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint + test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12.10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install locked backend + tooling
        run: uv sync --locked --extra test --extra lint --extra docs

      - name: Ruff lint
        run: |
          uv run --no-sync ruff check backend/app backend/tests scripts

      - name: Ruff format check
        run: |
          uv run --no-sync ruff format --check backend/app backend/tests scripts

      - name: Pyright (basic)
        run: |
          uv run --no-sync pyright

      - name: Pytest with coverage report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          uv run --no-sync pytest backend/tests/unit --cov=app --cov-report=xml --cov-report=term-missing -q -p no:cacheprovider

      - name: Rebuild handbook
        run: |
          uv run --no-sync python scripts/build_handbook.py
          uv run --no-sync python scripts/build_app_guide.py
          git diff --exit-code -- docs/APP_CAPABILITIES.html

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Build package distributions
        run: |
          uv build

      - name: Validate package metadata
        run: |
          uvx twine check dist/*

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
