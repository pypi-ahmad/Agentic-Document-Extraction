version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "streamlit"
          - "streamlit-pdf"
          - "httpx"
          - "pydantic"
          - "pymupdf"
          - "Pillow"
      tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "pyright"
          - "Markdown"
          - "reportlab"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
